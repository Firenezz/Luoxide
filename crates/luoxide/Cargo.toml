[package]
name = "luoxide"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
luoxide-compiler = { workspace = true }
luoxide-parser = { workspace = true, features = ["json"] }
luoxide-text = { workspace = true }
sha2 = "0.11.0"

[dev-dependencies]
codespan-reporting = "0.13.1"
serde_json = "1.0.140"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
