version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Cargo only allows `auto` or `lockfile-only`. `auto` already uses
    # bump-if-necessary for library crates (leave a `^1.2` range alone if
    # it still covers 1.3).
    versioning-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    # Minor + patch share one PR. Majors are ungrouped, so each breaking
    # bump is its own reviewable PR.
    groups:
      cargo-semver-compatible:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
