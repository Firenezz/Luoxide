version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    # Minor + patch share one PR. Majors are ungrouped, so each breaking
    # bump is its own reviewable PR.
    groups:
      cargo-semver-compatible:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
