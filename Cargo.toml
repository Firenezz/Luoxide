[package]
name = "Luoxidant"
version = "0.1.0"
edition = "2021"

[lib]
name = "luoxidant"
path = "src/lib.rs"

[[bin]]
name = "luoxidant"
path = "src/bin/main.rs"

[features]
default = [
  "__assert_snapshots",
]

# private features
__assert_snapshots = []

[dependencies]
env_logger = "0.11"
hexfloat2 = "0.1.3"
log = { version = "0.4", features = ["serde"] }
logos = "0.14"
rand = "0.8"
thiserror = "1.0"

[dev-dependencies]
insta = "1.36.1"

